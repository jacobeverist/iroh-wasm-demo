[package]
name = "iroh-wasm-demo"
version = "0.1.0"
edition = "2024"
default-run = "cli"
description = "iroh compiled to WebAssembly and driven from a browser via plain JS"
license = "MIT OR Apache-2.0"
publish = false

# cdylib -> the wasm module loaded by the browser.
# rlib   -> the same code linked into the native CLI peer.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cli"
required-features = ["cli"]

[dependencies]
# `default-features = false` is REQUIRED: the default `metrics` feature does not
# build for wasm32-unknown-unknown. `tls-ring` picks the rustls crypto backend.
iroh = { version = "1.0.3", default-features = false, features = ["tls-ring"] }

anyhow = "1.0"
async-channel = "2.3"
n0-future = "0.3"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.43", default-features = false, features = ["sync", "io-util"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tracing = "0.1"

# Native-only CLI peer.
clap = { version = "4.5", features = ["derive"], optional = true }

# --- wasm-only glue -------------------------------------------------------
[target.'cfg(target_arch = "wasm32")'.dependencies]
# iroh 1.0.3 pulls getrandom 0.4, which has NO entropy source on
# wasm32-unknown-unknown unless the `wasm_js` feature is on. We depend on it
# purely to switch that feature on for the whole graph (cargo unifies features),
# which routes randomness to `crypto.getRandomValues`.
#
# NOTE: getrandom 0.4 dropped the `--cfg getrandom_backend="wasm_js"` rustflag
# that 0.3 required and that most tutorials still tell you to set. In 0.4 the
# backend is chosen by `#[cfg(feature = "wasm_js")]` alone; the old rustflag is
# an inert no-op. Feature only.
getrandom = { version = "0.4", features = ["wasm_js"] }

console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"
tracing-subscriber = "0.3"
tracing-subscriber-wasm = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-streams = "0.5"

[features]
cli = ["tokio/full", "tokio/rt-multi-thread", "tokio/macros", "dep:clap"]

[profile.release]
codegen-units = 1
strip = "symbols"
debug = false
lto = true
opt-level = "z"
panic = "abort"
